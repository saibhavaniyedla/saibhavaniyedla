
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: saibhavaniyedla
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Lighten empty boxes in dark SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("dist/github-contribution-grid-snake-dark.svg")
          svg = p.read_text()

          # Replace the darkest empty-cell fill with a visible gray.
          svg = re.sub(
              r'fill="#161b22"',
              'fill="#30363d"',
              svg,
              flags=re.IGNORECASE
          )

          p.write_text(svg)
          PY

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
